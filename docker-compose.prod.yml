services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: qadam_lms
      POSTGRES_USER: qadam
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - qadam_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qadam -d qadam_lms"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - internal
    security_opt:
      - no-new-privileges:true

  app:
    build: .
    restart: unless-stopped
    init: true
    environment:
      PORT: 3000
      NODE_ENV: production
      DATABASE_URL: postgres://qadam:${POSTGRES_PASSWORD}@db:5432/qadam_lms
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      VERIFICATION_TTL_MINUTES: ${VERIFICATION_TTL_MINUTES:-15}
    expose:
      - "3000"
    volumes:
      - qadam_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - internal
      - web
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    networks:
      - web
    security_opt:
      - no-new-privileges:true

volumes:
  qadam_postgres:
  qadam_uploads:
  caddy_data:
  caddy_config:

networks:
  internal:
    internal: true
  web:
