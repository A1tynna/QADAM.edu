name: Test and deploy production

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: myqadam-production
  cancel-in-progress: false

jobs:
  test:
    name: Test application
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PORT: 3000
      NODE_ENV: test
      DATABASE_URL: postgres://qadam:qadam_password@127.0.0.1:5432/qadam_lms
      TEST_DATABASE_URL: postgres://qadam:qadam_password@127.0.0.1:5432/qadam_lms
      JWT_SECRET: github-actions-test-secret-only
      TEST_JWT_SECRET: github-actions-test-secret-only
      TEST_BASE_URL: http://127.0.0.1:3000/api

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: qadam_lms
          POSTGRES_USER: qadam
          POSTGRES_PASSWORD: qadam_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qadam -d qadam_lms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: npm run check

      - name: Start test server
        run: |
          npm start > /tmp/myqadam-test-server.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/api/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/myqadam-test-server.log
          exit 1

      - name: Check public routes
        run: |
          curl --fail --silent http://127.0.0.1:3000/ | grep --quiet "MyQadam"
          curl --fail --silent http://127.0.0.1:3000/portal | grep --quiet "MyQadam"

      - name: Run API and email verification tests
        run: npm test

      - name: Build production image
        run: docker build --tag myqadam-app:ci .

  deploy:
    name: Deploy to VPS
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://myqadam.kz

    steps:
      - name: Configure restricted SSH key
        env:
          DEPLOY_KEY: ${{ secrets.MYQADAM_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.MYQADAM_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" | tr -d '\r' > "$HOME/.ssh/myqadam_deploy"
          chmod 600 "$HOME/.ssh/myqadam_deploy"
          printf '%s\n' "$KNOWN_HOSTS" | tr -d '\r' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Deploy current main branch
        run: >-
          ssh
          -i "$HOME/.ssh/myqadam_deploy"
          -o BatchMode=yes
          -o IdentitiesOnly=yes
          -o StrictHostKeyChecking=yes
          deploy@77.67.8.201
          deploy

      - name: Verify production
        run: |
          curl --fail --silent --show-error \
            --retry 12 --retry-delay 5 --retry-all-errors \
            https://myqadam.kz/api/health
